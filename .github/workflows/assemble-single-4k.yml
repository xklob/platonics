name: Assemble single-form 4K videos
on:
  push:
    branches: [master]
    paths:
      - 'media-parts/single-4k/**'
      - 'tools/assemble_single_4k.py'
      - '.github/workflows/assemble-single-4k.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and assemble 4K videos
        run: python3 tools/assemble_single_4k.py
      - name: Commit assembled video files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add renders/videos-single/4d/hypercube-4k-60fps.mp4 renders/videos-single/4d/hypercube-4k-60fps-2x-zoom.mp4
          git rm -qr media-parts/single-4k
          if ! git diff --cached --quiet; then
            git commit -m 'Assemble and publish 4K single-form hypercube videos'
            git push origin HEAD:master
          fi
